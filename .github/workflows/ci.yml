name: CI - Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/BiliBili.Tests/BiliBili.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/BiliBili.Tests/BiliBili.Tests.csproj --configuration Release --no-restore