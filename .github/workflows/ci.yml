name: CI - Build & Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build UWP (Debug x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Debug /p:Platform=x86 /t:Restore /v:minimal /nologo

      - name: Build UWP main project
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Debug /p:Platform=x86 /t:Build /v:minimal /nologo /p:AppxPackageSigningEnabled=false

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/BiliBili.Tests/BiliBili.Tests.csproj

      - name: Run host behaviour tests
        # 宿主 HTML 的保留模式行为测试（D1~D22）。纯 node、零依赖，
        # 运行器自带 node，不需要 setup-node。
        run: node tests/host/retained-mode.test.js

      - name: Run real M8 script integration tests
        # 用仓库自带的 11 条真实 M8 脚本夹具跑集成测试（0 报错 + 真的落笔）。
        # 夹具就在 tests/host/fixtures/real/（约 808 KB），同样零依赖。
        run: node tests/host/real-m8-scripts.test.js

      - name: Run unit tests
        run: dotnet test tests/BiliBili.Tests/BiliBili.Tests.csproj --configuration Release --no-restore
