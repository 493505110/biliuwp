name: CI - Build & Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build UWP (Debug x86)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Debug /p:Platform=x86 /t:Restore /v:minimal /nologo

      - name: Build UWP main project
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Debug /p:Platform=x86 /t:Build /v:minimal /nologo /p:AppxPackageSigningEnabled=false

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/BiliBili.Tests/BiliBili.Tests.csproj

      - name: Run unit tests
        run: dotnet test tests/BiliBili.Tests/BiliBili.Tests.csproj --configuration Release --no-restore