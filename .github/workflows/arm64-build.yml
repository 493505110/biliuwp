name: Build ARM64 Package

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-arm64:
    name: Build ARM64 UWP
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Temporary Signing Certificate
        shell: pwsh
        run: |
          $pfxPassword = ConvertTo-SecureString -String "BiliUwpARM64" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=BiliBiliUWP-ARM64" \
            -KeyUsage DigitalSignature -FriendlyName "BiliBili UWP ARM64 Build" \
            -CertStoreLocation "Cert:\CurrentUser\My" \
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-PfxCertificate -Cert $cert -FilePath "BiliBili.UWP/appx_arm64.pfx" -Password $pfxPassword
          Export-Certificate -Cert $cert -FilePath "BiliBili-ARM64.cer"
          Write-Host "Self-signed certificate generated."

      - name: Restore NuGet
        run: |
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=ARM64 /t:Restore /v:minimal /nologo

      - name: Build UWP ARM64 Appx
        run: |
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=ARM64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=appx_arm64.pfx /p:PackageCertificatePassword=BiliUwpARM64 /p:GenerateAppxPackageOnBuild=true /t:Build /v:minimal /nologo

      - name: Collect Output Files
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Get-ChildItem -Path "BiliBili.UWP/AppPackages" -Recurse -Include *.appx,*.msix,*.msixbundle,*.cer | Copy-Item -Destination "dist"
          Copy-Item "BiliBili-ARM64.cer" -Destination "dist"
          Get-ChildItem "dist"

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliUWP-ARM64-Package
          path: dist/*
