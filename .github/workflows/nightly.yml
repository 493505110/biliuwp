name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'   # 每天北京时间 23:30
      timezone: Asia/Shanghai

jobs:
  nightly:
    name: Build & Publish Nightly
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits (skip if nightly is current)
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 手动触发:无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual trigger: building regardless of commit state"
            exit 0
          fi
          # 定时触发:对比当前 HEAD 与 nightly 标签指向的 commit,相同则跳过
          current="${{ github.sha }}"
          prev=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq '.object.sha' 2>/dev/null || echo "none")
          echo "current=$current prev=$prev"
          if [ -n "$prev" ] && [ "$prev" != "none" ] && [ "$current" = "$prev" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since last nightly ($current) — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commits detected (prev=$prev) — building"
          fi

      - name: Setup .NET
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        if: steps.check.outputs.skip != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        if: steps.check.outputs.skip != 'true'
        run: |
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x86 /t:Restore /v:minimal /nologo
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x64 /t:Restore /v:minimal /nologo

      - name: Restore signing certificate (pfx)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          PFX_B64: ${{ secrets.APPX_SIGNING_PFX }}
        run: |
          echo "$PFX_B64" | base64 -d > BiliBili.UWP/appx.pfx

      - name: Restore signing certificate (cer)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          CER_B64: ${{ secrets.APPX_SIGNING_CER }}
        run: |
          echo "$CER_B64" | base64 -d > biliuwp-signing.cer

      - name: Build UWP (Release x86+x64, signed)
        if: steps.check.outputs.skip != 'true'
        run: |
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x86 /p:PackageCertificateKeyFile=appx.pfx /p:PackageCertificateThumbprint= '/p:PackageCertificatePassword=${{ secrets.APPX_SIGNING_PFX_PASSWORD }}' /t:Build /v:minimal /nologo
          msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x64 /p:PackageCertificateKeyFile=appx.pfx /p:PackageCertificateThumbprint= '/p:PackageCertificatePassword=${{ secrets.APPX_SIGNING_PFX_PASSWORD }}' /t:Build /v:minimal /nologo

      - name: Locate installable packages
        id: packages
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.appx,*.appxbundle,*.msix,*.msixbundle -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'AppPackages' -and $_.FullName -notmatch 'Dependencies' }
          if (-not $files) { throw 'No installable packages found under AppPackages' }
          # UWP MinVersion>=17763 默认产出 .msix,与 .appx 容器内部一致,重命名即可(微软官方确认)
          $renamed = @()
          foreach ($f in $files) {
            $new = $f.FullName -replace '\.msix$', '.appx'
            if ($new -ne $f.FullName) { Copy-Item $f.FullName $new -Force }
            $renamed += $new
          }
          $list = ($renamed | ForEach-Object { $_ -replace '\\','/' }) -join ','
          $cer = (Resolve-Path 'biliuwp-signing.cer').Path -replace '\\','/'
          "files=$list,$cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # 提取 x86/x64 文件名供 release body 安装命令引用(避免硬编码版本号)
          $x86File = ($renamed | Where-Object { $_ -match '_x86\.appx$' } | Select-Object -First 1)
          $x64File = ($renamed | Where-Object { $_ -match '_x64\.appx$' } | Select-Object -First 1)
          if ($x86File) { "x86_file=$(Split-Path $x86File -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          if ($x64File) { "x64_file=$(Split-Path $x64File -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }

      - name: Get commits since latest release
        id: commits
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 找最新正式版 tag(非 prerelease),计算 nightly 相对其领先的提交
          latest=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.prerelease == false) | .tag_name][0]' 2>/dev/null || echo "none")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "null" ] && [ -n "$latest" ] && git rev-parse -q --verify "$latest" >/dev/null 2>&1; then
            count=$(git rev-list --count "$latest..HEAD")
            list=$(git log --oneline "$latest..HEAD" | head -20)
            echo "count=$count" >> "$GITHUB_OUTPUT"
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            echo "$list" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale nightly release/tag
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --yes 2>/dev/null || true
          # 强制把 nightly tag 移到当前 HEAD:本地 git 操作最可靠
          # (gh api PATCH 有参数类型/权限坑,曾导致 tag 停在旧提交、release 指向旧代码)
          git tag -f nightly "$GITHUB_SHA"
          # URL 内嵌 token 认证(extraheader 构造方式在 runner 上返回 400)
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nightly --force

      - name: Publish nightly release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            **Nightly 自动构建(自签名证书)**

            - 提交: `${{ github.sha }}`
            - 配置: Release x86 + x64,自签名证书,启用 .NET Native
            - 固定标签 `nightly`,每次构建覆盖更新

            **相对正式版 ${{ steps.commits.outputs.latest }} 领先 ${{ steps.commits.outputs.count }} 个提交：**
            ${{ steps.commits.outputs.list }}
          files: ${{ steps.packages.outputs.files }}
          prerelease: true
          fail_on_unmatched_files: true
