name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 = 北京时间 08:00

jobs:
  nightly:
    name: Build & Publish Nightly
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x86 /t:Restore /v:minimal /nologo

      - name: Restore signing certificate (pfx)
        shell: bash
        env:
          PFX_B64: ${{ secrets.APPX_SIGNING_PFX }}
        run: |
          echo "$PFX_B64" | base64 -d > BiliBili.UWP/BiliBili.UWP_TemporaryKey.pfx

      - name: Restore signing certificate (cer)
        shell: bash
        env:
          CER_B64: ${{ secrets.APPX_SIGNING_CER }}
        run: |
          echo "$CER_B64" | base64 -d > biliuwp-nightly.cer

      - name: Build UWP (Release x86, signed)
        run: msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release /p:Platform=x86 /p:UseDotNetNativeToolchain=false /p:PackageCertificatePassword=${{ secrets.APPX_SIGNING_PFX_PASSWORD }} /t:Build /v:minimal /nologo

      - name: Locate installable packages
        id: packages
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.appx,*.appxbundle,*.msix,*.msixbundle -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'AppPackages' -and $_.FullName -notmatch 'Dependencies' }
          if (-not $files) { throw 'No installable packages found under AppPackages' }
          # UWP MinVersion>=17763 默认产出 .msix,与 .appx 容器内部一致,重命名即可(微软官方确认)
          $renamed = @()
          foreach ($f in $files) {
            $new = $f.FullName -replace '\.msix$', '.appx'
            if ($new -ne $f.FullName) { Copy-Item $f.FullName $new -Force }
            $renamed += $new
          }
          $list = ($renamed | ForEach-Object { $_ -replace '\\','/' }) -join ','
          $cer = (Resolve-Path 'biliuwp-nightly.cer').Path -replace '\\','/'
          "files=$list,$cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove stale nightly release/tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/nightly" 2>/dev/null || true

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            **Nightly 自动构建(自签名证书)**

            - 提交: `${{ github.sha }}`
            - 配置: Release x86,自签名证书,关闭 .NET Native
            - 固定标签 `nightly`,每次构建覆盖更新

            首次安装(只需一次):
            1. 下载并双击 **`biliuwp-nightly.cer`** → 安装证书 → 本地计算机 → "受信任的根证书颁发机构"
            2. 开启开发者模式(Win10):设置 → 更新和安全 → 开发者选项 → 开发人员模式
            3. 双击下载的 .appx 安装,或 PowerShell: `Add-AppxPackage .\BiliBili.UWP_3.13.1.0_x86.appx`

            之后更新直接覆盖安装,无需再次导入证书。
          files: ${{ steps.packages.outputs.files }}
          prerelease: true
          fail_on_unmatched_files: true