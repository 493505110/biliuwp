name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'   # 每天北京时间 23:30
      timezone: Asia/Shanghai

concurrency:
  # 所有分支共用 nightly 标签和版本序列，必须串行发布。
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Build & Publish Nightly
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate nightly release logic
        shell: pwsh
        run: ./.github/scripts/tests/nightly-release.Tests.ps1

      - name: Check for new commits and complete publication
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/nightly-release.ps1 -Mode Check

      - name: Set nightly package version
        id: version
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/nightly-release.ps1 -Mode Version

      - name: Generate nightly changelog from Git commits
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $latest = $null
          try {
            $release = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
            $latest = $release.tag_name
            if ([string]::IsNullOrWhiteSpace($latest)) { throw 'Latest release has no tag name.' }
          } catch {
            if ($null -eq $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          $range = 'HEAD'
          $baseline = '全部提交历史（尚无正式版）'
          if ($latest) {
            $baseCommit = git rev-parse --verify --quiet "refs/tags/$latest^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve the latest release tag: $latest" }
            git merge-base --is-ancestor $baseCommit HEAD
            if ($LASTEXITCODE -ne 0) { throw "Latest release $latest is not an ancestor of this build." }
            $range = "$baseCommit..HEAD"
            $baseline = "相对正式版 $latest"
          }
          $commits = @(git rev-list $range --)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate Git commits for the nightly changelog.' }
          $items = @()
          foreach ($commit in $commits) {
            $item = git -c i18n.logOutputEncoding=utf-8 show --no-patch '--format=- %h %s' $commit
            if ($LASTEXITCODE -ne 0) { throw "Cannot read Git commit: $commit" }
            $items += $item
          }
          if ($items.Count -eq 0) { $items = @('- 本次重新构建，无新增提交。') }
          $date = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([datetime]::UtcNow, 'China Standard Time').ToString('yyyy-MM-dd')
          $encoding = [System.Text.UTF8Encoding]::new($false)
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $history = [System.IO.File]::ReadAllText($changelogPath) -replace '\A# 更新日志\s*', ''
          $nightlyLog = @('# 更新日志', '', "## $env:NIGHTLY_PACKAGE_VERSION Nightly ($date)") + $items + @('', $history)
          # 只在 runner 中生成打包用日志，仓库中的正式版 CHANGELOG.md 保持原样。
          [System.IO.File]::WriteAllText($changelogPath, ($nightlyLog -join "`n"), $encoding)
          $releaseBody = @(
            '**Nightly 自动构建(自签名证书)**', '',
            "- 提交: $env:GITHUB_SHA",
            "- 包版本: $env:NIGHTLY_PACKAGE_VERSION",
            '- 配置: Release x86 + x64 + ARM64,自签名证书,启用 .NET Native',
            '- 固定标签 nightly,每次构建覆盖更新', '',
            "**更新日志（$baseline，共 $($commits.Count) 个提交）**", ''
          ) + $items
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'nightly-release-notes.md'), ($releaseBody -join "`n"), $encoding)
          Write-Host "Generated nightly changelog from $($commits.Count) commits ($baseline)."

      - name: Setup .NET
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        if: steps.check.outputs.skip != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('BiliBili.UWP/**/*.csproj', '**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore signing certificate (pfx)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          PFX_B64: ${{ secrets.APPX_SIGNING_PFX }}
        run: |
          echo "$PFX_B64" | base64 -d > BiliBili.UWP/appx.pfx

      - name: Restore signing certificate (cer)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          CER_B64: ${{ secrets.APPX_SIGNING_CER }}
        run: |
          echo "$CER_B64" | base64 -d > biliuwp-signing.cer

      - name: Build UWP (Release x86+x64+ARM64, signed)
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          PACKAGE_CERTIFICATE_PASSWORD: ${{ secrets.APPX_SIGNING_PFX_PASSWORD }}
        run: |
          foreach ($platform in @('x86', 'x64', 'ARM64')) {
            # 条件包引用随平台变化，必须先还原当前平台再构建。
            msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release "/p:Platform=$platform" /t:Restore /v:minimal /nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild BiliBili.UWP/BiliBili.UWP.csproj /p:Configuration=Release "/p:Platform=$platform" /p:AppxBundle=Never /p:BuildAppxUploadPackageForUap=false /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile=appx.pfx /p:PackageCertificateThumbprint= "/p:PackageCertificatePassword=$env:PACKAGE_CERTIFICATE_PASSWORD" /t:Build /v:minimal /nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Locate installable packages
        id: packages
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          $files = Get-ChildItem -Path . -Recurse -Include *.appx,*.appxbundle,*.msix,*.msixbundle -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'AppPackages' -and $_.FullName -notmatch 'Dependencies' }
          if (-not $files) { throw 'No installable packages found under AppPackages' }
          foreach ($platform in @('x86', 'x64', 'ARM64')) {
            if (-not ($files | Where-Object { $_.Name -match "_$platform\.(appx|msix)$" })) {
              throw "No installable $platform package found under AppPackages"
            }
          }
          # 检查包内实际版本，避免发布文件名正确但内容仍使用旧版本的安装包。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($file in $files) {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($file.FullName)
            try {
              $entry = $archive.GetEntry('AppxManifest.xml')
              if ($null -eq $entry) { throw "Missing AppxManifest.xml in $($file.Name)" }
              $reader = [System.IO.StreamReader]::new($entry.Open())
              try { [xml]$packageManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($packageManifest.Package.Identity.Version -ne $env:EXPECTED_PACKAGE_VERSION -or
                  $file.Name -notmatch "_$([regex]::Escape($env:EXPECTED_PACKAGE_VERSION))_") {
                throw "Unexpected package version in $($file.Name); expected $env:EXPECTED_PACKAGE_VERSION"
              }
            } finally { $archive.Dispose() }
          }
          # UWP MinVersion>=17763 默认产出 .msix,与 .appx 容器内部一致,重命名即可(微软官方确认)
          $renamed = @()
          foreach ($f in $files) {
            $new = $f.FullName -replace '\.msix$', '.appx'
            if ($new -ne $f.FullName) { Copy-Item $f.FullName $new -Force }
            $renamed += $new
          }
          $list = ($renamed | ForEach-Object { $_ -replace '\\','/' }) -join ','
          $cer = (Resolve-Path 'biliuwp-signing.cer').Path -replace '\\','/'
          "files=$list,$cer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # 提取各架构文件名供 release body 安装命令引用(避免硬编码版本号)
          $x86File = ($renamed | Where-Object { $_ -match '_x86\.appx$' } | Select-Object -First 1)
          $x64File = ($renamed | Where-Object { $_ -match '_x64\.appx$' } | Select-Object -First 1)
          $arm64File = ($renamed | Where-Object { $_ -match '_ARM64\.appx$' } | Select-Object -First 1)
          if ($x86File) { "x86_file=$(Split-Path $x86File -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          if ($x64File) { "x64_file=$(Split-Path $x64File -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          if ($arm64File) { "arm64_file=$(Split-Path $arm64File -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }

      - name: Stage, verify and publish nightly release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          NIGHTLY_FILES: ${{ steps.packages.outputs.files }}
        run: ./.github/scripts/nightly-release.ps1 -Mode Publish
