<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        html, body, #stage {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        #stage {
            position: relative;
        }

        #stage canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <script>
        (function () {
            "use strict";

            // 渲染模型：保留模式（设计文档 §3.1）。
            // 每条脚本只执行一次，执行期间用 M8 的 $ / Player / Tween 建出保留元素树并声明补间；
            // 之后每帧只推进 tween 插值、更新属性、重绘脏元素。
            // 禁止每帧重跑脚本绘制：真实 M8 作品脚本里没有逐帧重绘代码，
            // 立即模式只会让画面停在第一帧（理由见设计文档 §3.1）。
            //
            // 清屏策略（设计文档 §3.1，本版修正）：逐帧**不做整屏 clearRect**，
            // 而是「本帧移动过 / 已释放 / 已隐藏」的元素按上一帧的包围盒擦除，
            // 再合成本帧的脏元素。静态元素因此既不会被重画、也不会被误擦。
            // 整屏 clearSurface() 只出现在「整幅画面作废」的三条路径上：tick 的隐藏分支、
            // stopRunning、以及 reset 整批替换条目时（被丢弃的元素不会再进擦除队列）。

            // 条目未声明 duration 时的兜底上限（毫秒）。duration 缺省或非正数
            // 表示「不设时间窗」——原版 M8 没有条目窗口，元素寿命由脚本的
            // lifeTime 决定，这里只留一个防呆上限，避免脚本永久占位。
            var MAX_ITEM_WINDOW_MS = 600000;
            var DEFAULT_LIFE_TIME_SECONDS = 3;
            var MAX_COMPILE_ERROR_REPORTS = 8;
            var MAX_RUNTIME_ERROR_REPORTS = 8;
            var DEFAULT_TEXT_COLOR = 16777215;
            var DEFAULT_TEXT_FONT = "黑体";
            var DEFAULT_TEXT_FONTSIZE = 25;
            var GLOW_PADDING = 12;
            var DEFAULT_BOUNDS_PADDING = 2;
            // 脏矩形擦除的外扩量（CSS 像素）：吸收缩放/旋转后的取整误差，
            // 否则被擦掉的一圈上会留下上一帧的细边。
            var DIRTY_RECT_PADDING = 2;
            // 元素寿命的「不设上限」取值：条目窗口剩余时间才是真正的上限。
            var LIFE_TIME_UNBOUNDED = Infinity;
            // 声明式 motion 里 repeat: 0 / 负数按无限重复处理，展开时用它兜住；
            // 真正的收口是元素寿命（元素到期时补间随之停止）。
            var MAX_REPEAT_EXPANSION = 1000;
            // 单帧最多推进多少「播放时间」。暂停 / seek / 长卡顿后帧增量可能极大，
            // 不钳制会让 Tween.* 句柄的时间轴一步跳完（与 M8 的逐帧推进语义不符）。
            var MAX_FRAME_DELTA_MS = 250;
            // Player.refreshRate 的取值区间（M8 文档：10-500，默认 170，精度 0.1 秒）。
            var DEFAULT_REFRESH_RATE = 170;
            var MIN_REFRESH_RATE = 10;
            var MAX_REFRESH_RATE = 500;
            // Player.jump 的 av 号解析：只接受 "av123" / "123" 两种写法。
            var AV_NUMBER_PATTERN = /^(?:av)?(\d+)$/i;
            // commentTrigger / keyTrigger 的默认监听时长（M8 文档：1000ms）。
            var DEFAULT_TRIGGER_TIMEOUT_MS = 1000;
            // 注入脚本作用域的 M8 全局名。compileItem 按这张表生成形参、
            // createScriptArgs 按同一顺序生成实参，两边必须逐字对应。
            var SCRIPT_GLOBAL_NAMES = [
                "$", "Player", "$G", "Global", "Tween", "Utils", "ScriptManager",
                "timer", "interval", "clearTimer", "trace", "tracex",
                "stopExecution", "foreach", "clone", "getTimer"];
            // 上面这张表的反查表：判断某个未声明标识符是不是已经注入过的 M8 全局名
            // （是的话说明不是「未声明」，补绑也救不了，直接按脚本失败处理）。
            var INJECTED_SCRIPT_NAMES = {};
            for (var injectedIndex = 0; injectedIndex < SCRIPT_GLOBAL_NAMES.length; injectedIndex++) {
                INJECTED_SCRIPT_NAMES[SCRIPT_GLOBAL_NAMES[injectedIndex]] = true;
            }

            // 「未声明标识符按 undefined 处理」的重试上限（见 runItemScriptWithAvm1Scope）。
            var MAX_AVM1_SCOPE_RETRIES = 8;
            // 保留字不能当形参。
            var RESERVED_WORDS = {
                break: true, case: true, catch: true, class: true, const: true, continue: true,
                debugger: true, default: true, delete: true, do: true, else: true, enum: true,
                export: true, extends: true, finally: true, for: true, function: true, if: true,
                import: true, in: true, instanceof: true, new: true, return: true, super: true,
                switch: true, this: true, throw: true, try: true, typeof: true, var: true,
                void: true, while: true, with: true, yield: true, let: true, static: true,
                null: true, true: true, false: true, arguments: true, eval: true
            };

            var state = {
                positionMs: 0,
                playing: false,
                rate: 1,
                updatedAt: performance.now()
            };

            var container = document.getElementById("stage");
            var canvas = null;
            var context2d = null;
            var items = [];
            var elements = [];
            var rootElement = createRetainedElement("group");
            var generation = 0;
            // 当前正在执行脚本 / 定时器回调 / 触发器回调的条目：$、interval、
            // commentTrigger 等全局函数靠它归属元素、定时器与触发器。
            var activeItem = null;
            // 弹幕快照（Player.commentList）。由 C# 侧推入，resetComments/appendComments 维护。
            var commentSnapshot = [];
            var nextTriggerId = 0;
            // 舞台遮罩（M8 的 Player.setMask）：非空时整块画布裁剪到该元件的形状里。
            var stageMaskElement = null;
            var visible = true;
            var running = false;
            var frameHandle = 0;
            var compileErrorCount = 0;
            var runtimeErrorCount = 0;
            // 合成阶段的错误（补间缓动是脚本传入的函数，可能在任意一帧抛错）
            // 与脚本执行错误分开计数：两者都不该刷屏，但也不该互相挤掉配额。
            var compositeErrorCount = 0;
            // 分块传输大脚本时的拼接缓冲（beginItem → appendItemChunk* → endItem）。
            var pendingItemJson = "";
            // 脚本执行次数计数：保留模式的核心契约是「每条脚本只执行一次」，
            // 这个计数器让它成为可断言的量。
            var totalRunCount = 0;
            var viewportWidth = 0;
            var viewportHeight = 0;
            var devicePixelRatioValue = 1;
            // 脏标记：tick 消费，tween 推进 / seek / setState 之类的变化置位。
            var dirty = false;
            // 绘制计数器：脏元素才会增加它，用于把「静态元素不重绘」做成可断言的契约。
            var paintCount = 0;
            // 待擦除的主画布矩形（像素坐标）。元素移动 / 释放 / 隐藏时入队，
            // 下一帧合成之前统一擦掉——这就是保留模式下的「清屏」。
            var pendingEraseRects = [];

            function post(type, values) {
                try {
                    if (!window.chrome
                        || !window.chrome.webview
                        || typeof window.chrome.webview.postMessage !== "function") {
                        return;
                    }

                    var message = { type: type };
                    if (values) {
                        for (var key in values) {
                            if (Object.prototype.hasOwnProperty.call(values, key)) {
                                message[key] = values[key];
                            }
                        }
                    }

                    window.chrome.webview.postMessage(JSON.stringify(message));
                } catch (error) {
                    // 消息桥不可用时仍让渲染器继续工作。
                }
            }

            function getErrorMessage(error) {
                if (!error) {
                    return "未知错误";
                }

                if (typeof error === "string") {
                    return error;
                }

                return error.message || String(error);
            }

            function reportError(stage, error, itemId) {
                post("error", {
                    stage: stage || "unknown",
                    itemId: itemId || "",
                    message: getErrorMessage(error)
                });
            }

            function reportCompileError(error, itemId) {
                if (compileErrorCount >= MAX_COMPILE_ERROR_REPORTS) {
                    return;
                }

                compileErrorCount++;
                reportError("compile", error, itemId);
            }

            function reportRuntimeError(error, itemId) {
                if (runtimeErrorCount >= MAX_RUNTIME_ERROR_REPORTS) {
                    return;
                }

                runtimeErrorCount++;
                reportError("runtime", error, itemId);
            }

            // 补间推进 / 合成阶段的上报通道。单独配额，避免一个每帧抛错的
            // 坏缓动把编译期错误的配额一起吃掉。
            function reportCompositeError(error, itemId) {
                if (compositeErrorCount >= MAX_RUNTIME_ERROR_REPORTS) {
                    return;
                }

                compositeErrorCount++;
                reportError("composite", error, itemId);
            }

            function currentPositionMs() {
                if (!state.playing) {
                    return state.positionMs;
                }

                return state.positionMs
                    + (performance.now() - state.updatedAt) * state.rate;
            }

            function ensureCanvas() {
                if (canvas) {
                    return;
                }

                canvas = document.createElement("canvas");
                canvas.style.pointerEvents = "none";
                container.appendChild(canvas);
                context2d = canvas.getContext("2d");
                resizeCanvas();
            }

            function resizeCanvas() {
                if (!canvas) {
                    return;
                }

                var width = container.offsetWidth || 1;
                var height = container.offsetHeight || 1;
                var ratio = window.devicePixelRatio || 1;
                viewportWidth = width;
                viewportHeight = height;
                devicePixelRatioValue = ratio;
                canvas.width = Math.max(1, Math.round(width * ratio));
                canvas.height = Math.max(1, Math.round(height * ratio));
                context2d = canvas.getContext("2d");
                if (context2d) {
                    context2d.setTransform(ratio, 0, 0, ratio, 0, 0);
                }

                markAllDirty();
            }

            function requestPause() {
                post("action", { action: "pause" });
                return true;
            }

            // 播放动作：与 pause / seek / navigate 走同一条宿主→C# 的 action 通道。
            // 由 PlayerPage 决定是恢复播放还是被拦截链拦下。
            function requestPlay() {
                post("action", { action: "play" });
                return true;
            }

            function requestSeek(seconds) {
                var value = Number(seconds);
                if (!isFinite(value) || value < 0) {
                    return false;
                }

                post("action", { action: "seek", seconds: value });
                return true;
            }

            function requestNavigate(url) {
                var value = String(url || "");
                if (!value) {
                    return false;
                }

                // 目标白名单由 PlayerPage 侧判定，这里只做非空与协议粗筛。
                if (value.indexOf("https://") !== 0 && value.indexOf("http://") !== 0) {
                    return false;
                }

                post("action", { action: "navigate", url: value });
                return true;
            }

            // ---- 补间缓动（对齐 M8 移植层 M8Easing 语义，支持 "M8Easing.SineEaseInOut" 全名）----

            function linearEase(time, begin, change, duration) {
                return change * time / duration + begin;
            }

            function sineEaseIn(time, begin, change, duration) {
                return -change * Math.cos(time / duration * (Math.PI / 2)) + change + begin;
            }

            function sineEaseOut(time, begin, change, duration) {
                return change * Math.sin(time / duration * (Math.PI / 2)) + begin;
            }

            function sineEaseInOut(time, begin, change, duration) {
                return -change / 2 * (Math.cos(Math.PI * time / duration) - 1) + begin;
            }

            function sineEaseOutIn(time, begin, change, duration) {
                if (time < duration / 2) {
                    return sineEaseIn(time * 2, begin, change / 2, duration);
                }

                return sineEaseOut(time * 2 - duration, begin + change / 2, change / 2, duration);
            }

            function powerEase(time, begin, change, duration, power) {
                return change * Math.pow(time / duration, power) + begin;
            }

            function powerEaseInOut(time, begin, change, duration, power) {
                var local = time / (duration / 2);
                if (local < 1) {
                    return change / 2 * Math.pow(local, power) + begin;
                }

                return change / 2 * (2 - Math.pow(2 - local, power)) + begin;
            }

            function quadraticEaseIn(time, begin, change, duration) {
                return powerEase(time, begin, change, duration, 2);
            }

            function quadraticEaseOut(time, begin, change, duration) {
                return powerEase(duration - time, begin + change, -change, duration, 2);
            }

            function quadraticEaseInOut(time, begin, change, duration) {
                return powerEaseInOut(time, begin, change, duration, 2);
            }

            function cubicEaseIn(time, begin, change, duration) {
                return powerEase(time, begin, change, duration, 3);
            }

            function cubicEaseOut(time, begin, change, duration) {
                return powerEase(duration - time, begin + change, -change, duration, 3);
            }

            function cubicEaseInOut(time, begin, change, duration) {
                return powerEaseInOut(time, begin, change, duration, 3);
            }

            function quinticEaseIn(time, begin, change, duration) {
                return powerEase(time, begin, change, duration, 5);
            }

            function quinticEaseOut(time, begin, change, duration) {
                return powerEase(duration - time, begin + change, -change, duration, 5);
            }

            function quinticEaseInOut(time, begin, change, duration) {
                return powerEaseInOut(time, begin, change, duration, 5);
            }

            function exponentialEaseIn(time, begin, change, duration) {
                if (time === 0) {
                    return begin;
                }

                return change * Math.pow(2, 10 * (time / duration - 1)) + begin;
            }

            function exponentialEaseOut(time, begin, change, duration) {
                if (time === duration) {
                    return begin + change;
                }

                return change * (1 - Math.pow(2, -10 * time / duration)) + begin;
            }

            function exponentialEaseInOut(time, begin, change, duration) {
                if (time === 0) {
                    return begin;
                }

                if (time === duration) {
                    return begin + change;
                }

                var local = time / (duration / 2);
                if (local < 1) {
                    return change / 2 * Math.pow(2, 10 * (local - 1)) + begin;
                }

                local = local - 1;
                return change / 2 * (2 - Math.pow(2, -10 * local)) + begin;
            }

            function circularEaseIn(time, begin, change, duration) {
                var local = time / duration;
                return -change * (Math.sqrt(1 - local * local) - 1) + begin;
            }

            function circularEaseOut(time, begin, change, duration) {
                var local = time / duration - 1;
                return change * Math.sqrt(1 - local * local) + begin;
            }

            function circularEaseInOut(time, begin, change, duration) {
                var local = time / (duration / 2);
                if (local < 1) {
                    return -change / 2 * (Math.sqrt(1 - local * local) - 1) + begin;
                }

                local = local - 2;
                return change / 2 * (Math.sqrt(1 - local * local) + 1) + begin;
            }

            var BACK_OVERSHOOT = 1.70158;

            function backEaseIn(time, begin, change, duration) {
                var local = time / duration;
                return change * local * local
                    * ((BACK_OVERSHOOT + 1) * local - BACK_OVERSHOOT) + begin;
            }

            function backEaseOut(time, begin, change, duration) {
                var local = time / duration - 1;
                return change * (local * local
                    * ((BACK_OVERSHOOT + 1) * local + BACK_OVERSHOOT) + 1) + begin;
            }

            function backEaseInOut(time, begin, change, duration) {
                var local = time / (duration / 2);
                if (local < 1) {
                    return change / 2 * (local * local
                        * (((BACK_OVERSHOOT * 1.525) + 1) * local - (BACK_OVERSHOOT * 1.525))) + begin;
                }

                local = local - 2;
                return change / 2 * (local * local
                    * (((BACK_OVERSHOOT * 1.525) + 1) * local + (BACK_OVERSHOOT * 1.525)) + 2) + begin;
            }

            var easingTable = {
                EaseNone: linearEase,
                Linear: linearEase,
                LinearEaseIn: linearEase,
                LinearEaseOut: linearEase,
                LinearEaseInOut: linearEase,
                LinearEaseOutIn: linearEase,
                SineEaseIn: sineEaseIn,
                SineEaseOut: sineEaseOut,
                SineEaseInOut: sineEaseInOut,
                SineEaseOutIn: sineEaseOutIn,
                QuadraticEaseIn: quadraticEaseIn,
                QuadraticEaseOut: quadraticEaseOut,
                QuadraticEaseInOut: quadraticEaseInOut,
                CubicEaseIn: cubicEaseIn,
                CubicEaseOut: cubicEaseOut,
                CubicEaseInOut: cubicEaseInOut,
                QuarticEaseIn: quinticEaseIn,
                QuarticEaseOut: quinticEaseOut,
                QuarticEaseInOut: quinticEaseInOut,
                QuinticEaseIn: quinticEaseIn,
                QuinticEaseOut: quinticEaseOut,
                QuinticEaseInOut: quinticEaseInOut,
                ExponentialEaseIn: exponentialEaseIn,
                ExponentialEaseOut: exponentialEaseOut,
                ExponentialEaseInOut: exponentialEaseInOut,
                CircularEaseIn: circularEaseIn,
                CircularEaseOut: circularEaseOut,
                CircularEaseInOut: circularEaseInOut,
                BackEaseIn: backEaseIn,
                BackEaseOut: backEaseOut,
                BackEaseInOut: backEaseInOut
            };

            function resolveEasing(value) {
                if (typeof value === "function") {
                    return value;
                }

                if (typeof value !== "string" || !value) {
                    return linearEase;
                }

                // 允许 "M8Easing.SineEaseInOut" 这类带命名空间的全名。
                var dot = value.lastIndexOf(".");
                var name = dot >= 0 ? value.substring(dot + 1) : value;
                return easingTable[name] || linearEase;
            }

            function toFiniteNumber(value, fallback) {
                var number = Number(value);
                return isFinite(number) ? number : fallback;
            }

            function normalizeColor(value) {
                var color = Math.floor(toFiniteNumber(value, DEFAULT_TEXT_COLOR));
                if (color < 0) {
                    color = 0;
                }

                return color & 0xFFFFFF;
            }

            // ---- 保留元素 ----

            var nextElementId = 1;

            function propertyDescriptor(name) {
                return {
                    configurable: true,
                    enumerable: true,
                    get: function () {
                        return this.props[name];
                    },
                    set: function (value) {
                        // 元素属性可写：直接赋值即标脏，下一帧只重绘该元素。
                        // 影响位图内容的属性（见 markPropertyDirty）还会让缓存失效。
                        setPropertyInternal(this, name, value, true);
                        markPropertyDirty(this, name);
                        dirty = true;
                    }
                };
            }

            function createRetainedElement(kind) {
                var element = {
                    id: nextElementId++,
                    kind: kind,
                    props: {
                        x: 0,
                        y: 0,
                        z: 0,
                        alpha: 1,
                        scaleX: 1,
                        scaleY: 1,
                        rotation: 0,
                        rotationX: 0,
                        rotationY: 0,
                        rotationZ: 0,
                        visible: true,
                        matrix: null,
                        filters: null,
                        // 以下四项是 Flash DisplayObject 的平移面属性：
                        //  - scaleZ        ：3D 缩放（2D 画布不呈现，只存储）
                        //  - blendMode     ：混合模式，映射到 canvas 的 globalCompositeOperation
                        //  - scrollRect    ：滚动矩形（需要裁剪语义，当前只存储）
                        //  - mask          ：元素级遮罩（真实现，见 applyElementMaskClip）
                        scaleZ: 1,
                        // Flash 的 DisplayObject.name（getChildByName 要用）。
                        name: "",
                        blendMode: "normal",
                        scrollRect: null,
                        mask: null,
                        // transform 命名空间上的三个可写量（matrix 复用 props.matrix）。
                        matrix3D: null,
                        colorTransform: null
                    },
                    // treeParent / childList 是元素树的真实字段；对脚本暴露的
                    // element.parent / element.children 是它们的读写访问器
                    // （见 defineTreeProperties）。不能直接用 parent/children 存树，
                    // 否则 attachElement 里 element.parent = target 会触发访问器
                    // 递归调用 addChildToParent。
                    childList: [],
                    treeParent: null,
                    // Flash 的 EventDispatcher 登记表（addEventListener /
                    // removeEventListener）。Akari 用 canvas 上的 "enterFrame"
                    // 监听驱动整幅画面的每帧更新。注意它挂在**元素自身**上，
                    // 不是 props（props 是变换/样式属性表）。
                    eventListeners: {},
                    ownerItem: null,
                    expired: false,
                    // 逐属性记脏：元素被整体标脏（例如 insertItem 时）后，
                    // 静态元素也不会因此被反复重绘。
                    propertyDirty: {},
                    painted: false,
                    needsCache: false,
                    cacheCanvas: null,
                    cacheCtx: null,
                    cacheBounds: null,
                    cacheOriginX: 0,
                    cacheOriginY: 0,
                    cacheDpr: 1,
                    // 复合缓存：元素有子节点时，首帧把子树烘到离屏画布，
                    // 之后整体作为一个元素做变换合成，子树不再逐帧绘制。
                    composite: null,
                    compositeDirty: false,
                    // 复合层位图在元素本地坐标系里的原点与尺寸（子树内容决定）。
                    compositeBounds: null,
                    // 元素在主画布上「上一帧画到哪」的包围盒。脏矩形擦除、以及
                    // 元素到期/隐藏时的残影清理都依赖它（没有它就只能整屏清屏）。
                    lastPaintedRect: null,
                    // 本帧内容缓存被重建过：即使位置没变也必须重新合成。
                    rebuiltThisFrame: false,
                    // 本帧是否是「脏元素」（擦除波及后的补画要跳过它，避免重复合成）。
                    dirtyCandidate: false,
                    // 元素级失败标记：补间推进抛错后停用该元素，不再逐帧重试。
                    failed: false,
                    hasTween: false,
                    // 脚本声明的寿命（毫秒），只记录 tween 声明的最大值；
                    // 不参与「条目窗口剩余时间」的合并，否则窗口值永远胜出、
                    // 声明只能延长不能缩短（见 applyElementLifeTime）。
                    declaredLifeTimeMs: LIFE_TIME_UNBOUNDED,

                            break;
                    }
                }

                return boundsResult(element.padding);
            }

            function elementLocalBounds(element) {
                var metrics;
                switch (element.kind) {
                    case "shape":
                        return computeShapeBounds(element);
                    case "text":
                        metrics = measureTextElement(element);
                        return {
                            x: 0,
                            y: 0,
                            width: Math.max(1, metrics.width) + DEFAULT_BOUNDS_PADDING * 2,
                            height: metrics.height + DEFAULT_BOUNDS_PADDING * 2
                        };
                    case "image":
                        if (!element.loaded) {
                            return null;
                        }

                        return {
                            x: 0,
                            y: 0,
                            width: Math.max(1, element.width),
                            height: Math.max(1, element.height)
                        };
                    case "layer":
                        return {
                            x: 0,
                            y: 0,
                            width: element.layerWidth,
                            height: element.layerHeight
                        };

                }
            }

            function applyElementTransform(target, element) {
                var props = element.props;
                var matrix = props.matrix;
                target.translate(props.x, props.y);
                if (props.rotation) {
                    target.rotate(props.rotation * Math.PI / 180);
                }

                if (matrix && typeof matrix === "object") {
                    target.transform(
                        toFiniteNumber(matrix.a, 1),
                        toFiniteNumber(matrix.b, 0),
                        toFiniteNumber(matrix.c, 0),
                        toFiniteNumber(matrix.d, 1),
                        toFiniteNumber(matrix.tx, 0),
                        toFiniteNumber(matrix.ty, 0));
                }

                target.scale(props.scaleX, props.scaleY);
                target.globalAlpha = Math.max(0, Math.min(1, props.alpha));
            }

            function hasGlowFilter(element) {
                var filters = element.props.filters;
                if (!filters || !filters.length) {
                    return false;
                }

                for (var index = 0; index < filters.length; index++) {
                    var filter = filters[index];
                    var name = filter && (filter.type || filter.kind);
                    if (name === "GlowFilter" || name === "Glow") {
                        return true;
                    }
                }

                return false;
            }

            // 内容绘制：把元素自己的图元画到给定的 2D 上下文（本地坐标系）。
            function paintElementContent(target, element) {
                if (element.kind === "shape") {
                    drawShapeElement(target, element, 0, 0);
                } else if (element.kind === "text") {
                    drawTextElement(target, element, 0, 0);
                } else if (element.kind === "image" && element.imageValue) {
                    target.drawImage(element.imageValue, 0, 0);
                } else if (element.kind === "layer") {
                    target.drawImage(element.layerCanvas, 0, 0);
                }

                // 发光滤镜在缓存阶段一次性施加：脚本只画一次，滤镜不必每帧重算。
                if (hasGlowFilter(element) && typeof target.filter === "string") {
                    target.filter = "blur(4px)";
                    target.globalCompositeOperation = "lighter";
                    paintElementContentRaw(target, element);
                    target.globalCompositeOperation = "source-over";
                    target.filter = "none";
                }
            }

            function paintElementContentRaw(target, element) {
                if (element.kind === "shape") {
                    drawShapeElement(target, element, 0, 0);
                } else if (element.kind === "text") {
                    drawTextElement(target, element, 0, 0);
                } else if (element.kind === "image" && element.imageValue) {
                    target.drawImage(element.imageValue, 0, 0);
                }
            }

            // 叶子元素的内容缓存。只有 needsCache 置位时才会走到这里——
            // 这是「静态元素首帧之后不再重绘」的落点。
            function rebuildElementCache(element) {
                var bounds = elementLocalBounds(element);
                element.needsCache = false;
                if (!bounds) {
                    element.cacheCanvas = null;
                    element.cacheCtx = null;
                    element.cacheBounds = null;
                    element.painted = true;
                    return;
                }

                var padding = hasGlowFilter(element) ? GLOW_PADDING : 0;
                var ratio = window.devicePixelRatio || 1;
                var width = Math.max(1, Math.ceil((bounds.width + padding * 2) * ratio));
                var height = Math.max(1, Math.ceil((bounds.height + padding * 2) * ratio));
                if (!element.cacheCanvas) {
                    element.cacheCanvas = document.createElement("canvas");
                }

                if (element.cacheCanvas.width !== width || element.cacheCanvas.height !== height) {

                    element.cacheCanvas.height = height;
                }

                element.cacheCtx = element.cacheCanvas.getContext("2d");
                var target = element.cacheCtx;
                target.setTransform(1, 0, 0, 1, 0, 0);
                target.clearRect(0, 0, width, height);
                target.setTransform(ratio, 0, 0, ratio, 0, 0);
                target.translate(padding - bounds.x, padding - bounds.y);
                target.globalAlpha = 1;
                paintElementContent(target, element);

                element.cacheBounds = {
                    x: bounds.x - padding,
                    y: bounds.y - padding,
                    width: bounds.width + padding * 2,
                    height: bounds.height + padding * 2
                };
                element.painted = true;
                paintCount++;
            }

            // 复合元素的子树烘焙。子元素走 blitElement（用自己的缓存），
            // 所以重建复合层是 N 次位图拷贝，而不是 N 份绘制代码。
            // 复合层的实际尺寸取决于子树内容（子元素坐标相对父元件注册点）。
            // 返回 null 表示子树当前没有可绘制内容（空容器首帧不建复合层）。
            function computeCompositeBounds(element) {
                boundsReset();
                for (var index = 0; index < element.childList.length; index++) {
                    var child = element.childList[index];
                    if (child.expired || child.props.visible === false) {
                        continue;
                    }

                    if (child.childList.length > 0) {
                        var childBounds = computeCompositeBounds(child);
                        if (!childBounds) {
                            continue;
                        }

                        var childTransform = compositeChildBounds(child, childBounds);
                        boundsAdd(childTransform.x, childTransform.y);
                        boundsAdd(
                            childTransform.x + childTransform.width,
                            childTransform.y + childTransform.height);
                        continue;
                    }

                    var bounds = elementLocalBounds(child);
                    if (!bounds) {
                        continue;
                    }

                    var transformed = compositeChildBounds(child, bounds);
                    boundsAdd(transformed.x, transformed.y);
                    boundsAdd(
                        transformed.x + transformed.width,
                        transformed.y + transformed.height);
                }

                return boundsResult(0);
            }

            // 子元素在父元件坐标系里的外接矩形（缩放 → 旋转 → 平移，
            // 与 applyElementTransform 同序）。
            function compositeChildBounds(child, bounds) {
                var props = child.props;
                var scaleX = toFiniteNumber(props.scaleX, 1);
                var scaleY = toFiniteNumber(props.scaleY, 1);
                var rotation = toFiniteNumber(props.rotation, 0) * Math.PI / 180;
                var cos = Math.cos(rotation);
                var sin = Math.sin(rotation);
                var corners = [
                    [bounds.x, bounds.y],
                    [bounds.x + bounds.width, bounds.y],
                    [bounds.x + bounds.width, bounds.y + bounds.height],
                    [bounds.x, bounds.y + bounds.height]
                ];

                var minX = Infinity;
                var minY = Infinity;
                var maxX = -Infinity;
                var maxY = -Infinity;
                for (var index = 0; index < corners.length; index++) {
                    var localX = corners[index][0] * scaleX;
                    var localY = corners[index][1] * scaleY;
                    var pageX = localX * cos - localY * sin + props.x;
                    var pageY = localX * sin + localY * cos + props.y;
                    if (pageX < minX) {
                        minX = pageX;
                    }

                    if (pageY < minY) {
                        minY = pageY;
                    }

                    if (pageX > maxX) {
                        maxX = pageX;
                    }

                    if (pageY > maxY) {
                        maxY = pageY;
                    }
                }

                return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
            }

            function rebuildComposite(element) {
                var bounds = computeCompositeBounds(element);
                element.compositeDirty = false;
                if (!bounds) {
                    // 子树当前没有内容：不建/不重建复合层。保留已有位图（若有），
                    // 位置也不改——空容器在屏幕上本来就不占像素。
                    return;
                }

                // 子元素坐标相对父元件注册点：烘焙时把 bounds 原点平移到
                // (padding, padding)，blit 时再按 bounds 的偏移取用，
                // 这样父元件自己移动/缩放/旋转时子树不必重绘（见 D4）。
                var ratio = window.devicePixelRatio || 1;
                var width = Math.max(1, Math.ceil(bounds.width * ratio));
                var height = Math.max(1, Math.ceil(bounds.height * ratio));
                if (!element.composite) {
                    element.composite = document.createElement("canvas");
                }

                if (element.composite.width !== width || element.composite.height !== height) {
                    element.composite.width = width;
                    element.composite.height = height;
                }

                var target = element.composite.getContext("2d");
                target.setTransform(1, 0, 0, 1, 0, 0);
                target.clearRect(0, 0, width, height);
                target.setTransform(ratio, 0, 0, ratio, 0, 0);
                target.translate(-bounds.x, -bounds.y);
                for (var index = 0; index < element.childList.length; index++) {
                    blitElement(target, element.childList[index]);
                }

                element.compositeBounds = bounds;
                element.painted = true;
                paintCount++;
            }

            function blitElement(target, element) {
                if (!element || element.expired || element.props.visible === false) {
                    return;
                }

                // 被当作遮罩的元件自己不参与渲染（Flash 语义：遮罩对象不绘制）。
                if (isUsedAsMask(element)) {
                    return;
                }

                if (element.childList.length > 0) {
                    if (!element.composite) {
                        rebuildComposite(element);
                    }

                    if (!element.composite) {
                        return;
                    }

                    target.save();
                    applyElementMaskClip(target, element);
                    applyElementTransform(target, element);
                    applyElementBlendMode(target, element);
                    var compositeBoundsValue = element.compositeBounds || {
                        x: 0,
                        y: 0,
                        width: element.composite.width / (window.devicePixelRatio || 1),
                        height: element.composite.height / (window.devicePixelRatio || 1)
                    };
                    target.drawImage(
                        element.composite,
                        compositeBoundsValue.x,
                        compositeBoundsValue.y,
                        compositeBoundsValue.width,
                        compositeBoundsValue.height);
                    target.restore();
                    return;
                }

                if (element.kind === "layer") {
                    target.save();
                    applyElementMaskClip(target, element);
                    applyElementTransform(target, element);
                    applyElementBlendMode(target, element);
                    target.drawImage(element.layerCanvas, 0, 0, element.layerWidth, element.layerHeight);
                    target.restore();
                    return;
                }

                if (!element.painted || element.needsCache) {
                    rebuildElementCache(element);
                }

                if (!element.cacheCanvas || !element.cacheBounds) {
                    return;
                }

                target.save();
                applyElementMaskClip(target, element);
                applyElementTransform(target, element);
                applyElementBlendMode(target, element);
                target.drawImage(
                    element.cacheCanvas,
                    element.cacheBounds.x,
                    element.cacheBounds.y,
                    element.cacheBounds.width,
                    element.cacheBounds.height);
                target.restore();
            }

            function isSubtreeDirty(element) {
                if (!element.painted || element.needsCache || element.compositeDirty
                    || isElementDirty(element)) {
                    return true;
                }

                for (var index = 0; index < element.childList.length; index++) {
                    if (isSubtreeDirty(element.childList[index])) {
                        return true;
                    }
                }

                return false;
            }

            function clearSubtreeDirty(element) {
                element.propertyDirty = {};
                element.compositeDirty = false;
                for (var index = 0; index < element.childList.length; index++) {
                    clearSubtreeDirty(element.childList[index]);
                }
            }

            // ---- 条目生命周期 ----

            function isInWindow(item, now) {
                return now >= item.startMs && now <= item.endMs;
            }

            function registerItemElement(item, element) {
                element.ownerItem = item;
                // 寿命初值 = 条目窗口剩余时间（未声明 tween 时就是这个值）。
                // 声明了 tween 的元素再由 tween 的 lifeTime 收紧，
                // 取 min(声明值, 窗口剩余)，见 applyElementLifeTime。
                element.declaredLifeTimeMs = LIFE_TIME_UNBOUNDED;
                element.lifeTimeMs = resolveElementLifeTimeMs(item, LIFE_TIME_UNBOUNDED);

                item.elements.push(element);
                // parent 由创建参数决定；未指定时挂到条目 Canvas（M8 的默认父元件）。
                if (element.treeParent === null) {
                    attachElement(element, element.createParent || null);
                }

                element.createParent = null;
                return element;
            }

            // 条目级内容重置：ScriptManager.clearEl / clearTimer / clearTrigger 用。
            // clearEl 只摘元素（元素的 tween 与定时器随之失效），不重置整个条目。
            function clearItemElements(item) {
                for (var index = item.elements.length - 1; index >= 0; index--) {
                    // 被 ScriptManager.popEl() 标记过的元件不清（M8 语义：
                    // popEl 就是「从自动清理表里弹出」）。
                    if (item.elements[index].exemptFromClear) {
                        continue;
                    }

                    releaseItemElement(item, index);
                }

                dirty = true;
            }

            function clearItemTimers(item) {
                clearItemScheduledTimers(item);

            }

            function clearItemTriggers(item) {

            }

            // ---- commentTrigger / keyTrigger ----
            //
            // 触发器登记在条目上，与定时器共用同一条生命周期：条目回收 / reset /
            // seek 越窗时由 clearItemTriggers 统一清掉，触发器绝不会活过条目。
            //
            // timeout 用「条目已播放时间」计量（与画面同一时钟），因此暂停时不推进、
            // 不会莫名其妙过期。注意这与 M8 文档「不会因播放器暂停而终止执行」不同：
            // 本宿主的一切都挂在这条时钟上，混用两套时钟会让触发时机与画面错位。
            //
            // 投递是**消息驱动**的（pushComment / pushKey 到达时同步调用），
            // 不依赖帧循环，所以暂停时收到的事件也会立即送达回调。
            function itemElapsedMs(item) {
                return Math.max(0, currentPositionMs() - item.startMs);
            }

            // M8 的 keyTrigger 只监听这一组键（文档明确列出），其余按键不投递。
            // 键值与 DOM/Flash 的 keyCode 同源，C# 侧直接透传 VirtualKey 的整数值。
            var M8_TRIGGER_KEY_CODES = {
                33: true, 34: true, 35: true, 36: true, 37: true, 38: true, 39: true, 40: true,
                65: true, 68: true, 83: true, 87: true,
                96: true, 97: true, 98: true, 99: true, 100: true,
                101: true, 102: true, 103: true, 104: true, 105: true
            };

            function normalizeTriggerTimeout(timeoutMs) {
                var value = toFiniteNumber(timeoutMs, DEFAULT_TRIGGER_TIMEOUT_MS);
                return value > 0 ? value : DEFAULT_TRIGGER_TIMEOUT_MS;
            }

            function registerItemTrigger(kind, callback, timeoutMs, up) {
                if (typeof callback !== "function") {
                    return 0;
                }

                var item = currentItem();
                if (!item) {
                    return 0;
                }

                var trigger = {
                    id: ++nextTriggerId,
                    kind: kind,
                    callback: callback,
                    up: !!up,
                    ownerItem: item,
                    registeredAtMs: itemElapsedMs(item),
                    timeoutMs: normalizeTriggerTimeout(timeoutMs)
                };
                item.triggers.push(trigger);
                return trigger.id;
            }

            // 取出该条目上该类型「未过期」的触发器，顺手回收已过期的。
            function liveTriggers(item, kind, keyUp) {
                var elapsed = itemElapsedMs(item);
                var live = [];
                for (var index = item.triggers.length - 1; index >= 0; index--) {
                    var trigger = item.triggers[index];
                    if (trigger.kind !== kind) {
                        continue;
                    }

                    if (kind === "key" && trigger.up !== keyUp) {
                        continue;
                    }

                    if (elapsed - trigger.registeredAtMs >= trigger.timeoutMs) {
                        item.triggers.splice(index, 1);
                        continue;
                    }

                    live.push(trigger);
                }

                return live;
            }

            function removeTrigger(item, trigger) {
                var index = item.triggers.indexOf(trigger);
                if (index >= 0) {
                    item.triggers.splice(index, 1);
                }
            }

            // 触发器回调在「该条目」的上下文里执行：回调里可以照常建元件、开定时器。
            function invokeTrigger(trigger, argument) {
                var item = trigger.ownerItem;
                var previous = activeItem;
                activeItem = item;
                item.activeNow = currentPositionMs();
                try {
                    trigger.callback(argument);
                } catch (error) {
                    // 回调抛错只摘掉这一个触发器，不影响其它触发器与整帧。
                    removeTrigger(item, trigger);
                    if (!recoverItemFromCallbackError(item, error)) {
                        reportRuntimeError(error, item.model.id);
                    }
                } finally {
                    activeItem = previous;
                    item.createParent = null;
                }

                dirty = true;
                ensureRunning();
            }

            function forEachTriggerItem(callback) {
                var now = currentPositionMs();
                for (var index = 0; index < items.length; index++) {
                    var item = items[index];
                    // 只有「已激活、在窗口内、没失败」的条目才收事件：窗口外的条目
                    // 已经被 deactivateItem 清过触发器，这里再挡一道防边界竞态。
                    if (!item.activated || item.failed || !isInWindow(item, now)) {
                        continue;
                    }

                    callback(item);
                }
            }

            function deliverCommentTrigger(comment) {
                forEachTriggerItem(function (item) {
                    var triggers = liveTriggers(item, "comment", false);
                    for (var index = 0; index < triggers.length; index++) {
                        invokeTrigger(triggers[index], comment);
                    }
                });
            }

            function deliverKeyTrigger(keyCode, keyUp) {
                if (!M8_TRIGGER_KEY_CODES[keyCode]) {
                    return;
                }

                forEachTriggerItem(function (item) {
                    var triggers = liveTriggers(item, "key", keyUp);
                    for (var index = 0; index < triggers.length; index++) {
                        invokeTrigger(triggers[index], keyCode);
                    }
                });
            }

            // ---- 弹幕快照（M8 的 Player.commentList）----
            //
            // 由 C# 侧推入：resetComments() 清空、appendComments([...]) 追加。
            // 字段与 M8 的 CommentData 同名同义（txt / time / color / pool / mode /
            // fontSize），宿主只做缺省填充，不做重命名，脚本拿到的就是 M8 的形状。
            function normalizeComment(raw) {
                var source = raw && typeof raw === "object" ? raw : {};
                return {
                    txt: source.txt === undefined || source.txt === null ? "" : String(source.txt),
                    // M8 的 CommentData.time 是**秒**（Player.time 才是毫秒）。
                    time: toFiniteNumber(source.time, 0),
                    color: normalizeColor(source.color),
                    pool: Math.trunc(toFiniteNumber(source.pool, 0)),
                    mode: Math.trunc(toFiniteNumber(source.mode, 1)),
                    fontSize: toFiniteNumber(source.fontSize, DEFAULT_TEXT_FONTSIZE)
                };
            }

            function activateItem(item, now) {
                item.activated = true;
                item.removed = false;
                item.failed = false;
                // 重跑脚本前先把上一次的定时器 / 句柄清掉，避免重建后两份并存。
                clearItemTimers(item);
                clearItemTriggers(item);
                // 脚本在这里、也只在这里执行一次。之后每帧只推进 tween。
                // 计数按「一次激活」算一次，重试用的是同一次激活里的重跑（见下）。
                item.runCount++;
                totalRunCount++;
                runItemScriptWithAvm1Scope(item);
            }

            // 执行脚本正文；遇到「读未声明变量」抛 ReferenceError 时按 AVM1
            // （Flash 8 / AS2）的宽容语义补救：**把那个标识符声明到脚本全局对象上
            // 并置为 undefined**，然后重跑本条脚本。
            //
            // 为什么要这一层：M8 脚本是 AS2 时代写给 AVM1 的，那里读未声明变量得到
            // undefined、不抛错。真实样本里 `update:function(time){if(time <
            // startTime)...}` 的 startTime / duration 就是**翻译时丢掉的 var**——
            // AVM1 下它们读成 undefined（比较恒为 false，正文照跑），JS 下直接
            // ReferenceError，整条脚本停摆。
            //
            // 为什么修在全局对象上而不是补脚本形参：这些闭包可能**不是本条脚本创建的**。
            // entry_10 抛错的那处 `update` 定义在 entry_08 的 Akari 库里，
            // 它的作用域链早在 entry_08 执行时就定死了——给 entry_10 的编译结果
            // 加形参救不了它。标识符解析对「未绑定名」是每次访问都回落到全局对象上查的，
            // 所以只要在全局对象上把名字补出来，**已经建好的闭包也会立刻恢复正常**。
            //
            // 安全性：只声明「已被 ReferenceError 证明不存在」的名字，因此绝不会遮蔽
            // 任何真实存在的名字——脚本自己声明的、或像 entry_10 那样用
            // `Factory.extend(this, …)` 导出到全局对象上的，都照旧解析。
            // 不做任何静态分析，也不动作用域链（不用 with）。
            function runItemScriptWithAvm1Scope(item) {
                for (var attempt = 0; attempt <= MAX_AVM1_SCOPE_RETRIES; attempt++) {
                    try {
                        var scriptArgs = createScriptScope(item);
                        activeItem = item;
                        item.run.apply(null, scriptArgs);
                        return;
                    } catch (error) {
                        if (error === STOP_EXECUTION_SIGNAL) {
                            // 脚本自己调了 stopExecution()：正常终止，不计为错误。
                            item.removed = false;
                            return;
                        }

                        if (!declareAvm1GlobalIfUndeclared(error)) {
                            // 不是「未声明变量」这类错误，或已经修不动了：按脚本自身
                            // 的失败处理（停用该条目，不影响同帧其它条目）。
                            item.failed = true;
                            reportRuntimeError(error, item.model.id);
                            return;
                        }

                        // 上一次跑出来的元件、定时器、触发器全部作废：脚本会被完整
                        // 重跑一遍，留着会变成两份（与 seek 重建同一条清理路径）。
                        releaseItemForRerun(item);
                    } finally {
                        activeItem = null;
                        // clearEl / clearTimer 之类的清理要发生在脚本执行之后、
                        // 下一帧推进之前，否则被清掉的元素还会被推进一帧。
                        item.createParent = null;
                    }
                }
            }

            // 已按 AVM1 语义补出来的全局名（跨条目共享：同一个名字只需补一次，
            // 补完对所有条目的闭包都生效）。
            var avm1DeclaredGlobals = {};

            // 从错误里认出「读未声明变量」，把该名字声明到全局对象上。
            // 返回 true 表示已经补救（调用方应清理并重跑）。
            function declareAvm1GlobalIfUndeclared(error) {
                var missingName = readUndeclaredIdentifier(error);
                if (missingName === null || INJECTED_SCRIPT_NAMES[missingName]) {
                    return false;
                }

                if (avm1DeclaredGlobals[missingName]
                    || Object.prototype.hasOwnProperty.call(window, missingName)) {
                    // 已经补过了／其实存在：说明不是「未声明」这一个原因，别再兜圈子。
                    return false;
                }

                avm1DeclaredGlobals[missingName] = true;
                // 声明在脚本全局对象上，值与 AVM1 一致：undefined。
                window[missingName] = undefined;
                return true;
            }

            // 定时器 / 触发器回调里抛出的错误：与脚本正文走同一套 AVM1 补救。

            // 为什么回调也要管：entry_10 的 `startTime` 不是正文里读的，而是正文建立的
            // interval 回调里读的（`composition.update(Player.time)`）。只补正文的话
            // 正文跑过了、回调一触发还是 ReferenceError。
            //
            // 补救方式只能是「补绑 → 重编译 → 整条脚本重跑」：闭包是在重跑时新建的，
            // 新闭包才会带上补绑的形参。返回 true 表示已经补救（调用方应停止处理该错误）。
            function recoverItemFromCallbackError(item, error) {
                if (!declareAvm1GlobalIfUndeclared(error)) {
                    return false;
                }

                // 补完全局还不够：抛错的那个回调所属的定时器已经停了、
                // 半截状态也要清掉，所以把本条脚本完整重跑一遍。
                releaseItemForRerun(item);
                runItemScriptWithAvm1Scope(item);
                return true;
            }

            function readUndeclaredIdentifier(error) {

                }

                var message = String(error.message || "");
                var match = /^(?:can't find variable: |)?([A-Za-z_$][A-Za-z0-9_$]*) is not defined/.exec(message)
                    || /^([A-Za-z_$][A-Za-z0-9_$]*) is not defined/.exec(message)
                    || /^ReferenceError: ([A-Za-z_$][A-Za-z0-9_$]*) is not defined/.exec(message);
                if (!match) {
                    return null;
                }

                // 保留字不能当形参，直接放弃（脚本用保留字当变量名本身就是语法错误）。
                return RESERVED_WORDS[match[1]] ? null : match[1];
            }

            // 重跑前的清理：与 deactivateItem 同一条释放路径，但不改 activated 状态。
            function releaseItemForRerun(item) {
                clearItemTimers(item);
                clearItemTriggers(item);
                item.frameListeners = [];
                for (var index = item.elements.length - 1; index >= 0; index--) {
                    releaseItemElement(item, index);
                }

                item.lastAdvanceMs = -1;
            }

            // 条目级失败：同一处只上报一次，之后逐帧跳过，避免每帧刷屏。
            function failItem(item, error) {
                if (item.failed) {
                    return;
                }

                item.failed = true;
                reportCompositeError(error, item.model.id);
            }

            function releaseItemElement(item, index) {
                var element = item.elements[index];
                // 到期摘除并释放离屏缓存，脚本不负责清理。
                // detachElement 会把它的主画布矩形入队，本帧擦掉残影。
                // 顺序不能反：markElementMoved 见到 element.expired 为真会直接
                // 返回，先标 expired 就入不了队，元素最后一帧的像素会永久
                // 留在画布上（条目窗口结束时尤其明显）。
                detachElement(element);
                element.expired = true;
                item.elements.splice(index, 1);
            }

                item.removed = true;
                item.frameListeners = [];

                // 正是「条目销毁后 interval 还在跑」——这里由宿主兜底，脚本不必自己清。
                clearItemTimers(item);
                clearItemTriggers(item);

                }
            }

                var delta = elapsed - item.lastAdvanceMs;

                }

                // 定时器到期项跑掉，再推进补间。
                activeItem = item;
                item.activeNow = now;

                    runItemTimers(item, delta);
                } catch (error) {
                    failItem(item, error);
                } finally {
                    activeItem = null;
                }

                // 必须早于下面「推进补间 / 重绘脏元素」，否则本帧画的是旧状态。
                dispatchItemEnterFrame(item);

                try {
                    advanceItemHandles(item, delta);
                } catch (error) {
                    failItem(item, error);
                }

                    var element = item.elements[index];
                    if (element.expired) {
                        continue;
                    }

                    // 否则两套时间轴会互相覆盖（先句柄后条目，句柄结果当场被冲掉）。
                    // 单个元素出错不拖垮整条条目，更不拖垮整帧：
                    // 只把该元素标成已失败，后续帧不再推进它。
                    if (element.hasTween && !isMotionHandleDriven(element)) {
                        try {
                            advanceElementMotion(element, elapsed);
                        } catch (error) {
                            element.failed = true;
                            failItem(item, error);
                        }
                    }

                    if (elapsed >= element.lifeTimeMs) {
                        releaseItemElement(item, index);
                    }
                }

            }

            function updateItems(now) {
                var anyActive = false;
                for (var index = 0; index < items.length; index++) {
                    var item = items[index];
                    if (isInWindow(item, now)) {
                        anyActive = true;
                        if (item.compileFailed) {
                            continue;
                        }

                        if (!item.activated) {
                            activateItem(item, now);
                        } else {
                            advanceItem(item, now);
                        }
                    } else if (item.activated) {
                        deactivateItem(item);
                    }
                }

                return anyActive;
            }

            // seek 后按新位置重算插值：已激活且在窗口内的条目只让 tween 重新插值，
            // 不重跑脚本；元素已经到期被摘除的（例如向后拖过再拖回来），
            // 按条目进度重算补间后重建元素——脚本仍然不重跑，也不重复执行。
            function resetItemsForSeek(now) {
                for (var index = 0; index < items.length; index++) {
                    var item = items[index];
                    if (!isInWindow(item, now)) {
                        if (item.activated) {
                            deactivateItem(item);
                        }

                        continue;
                    }

                    if (!item.activated) {
                        continue;
                    }

                    // 条目中途失败过（脚本或缓动抛错）就不再重建，
                    // 否则 seek 会把已经停用的坏条目重新拉活。
                    if (item.failed) {
                        continue;
                    }

                    rebuildItemElementsForSeek(item, now);

                    // 重建后句柄时间轴要跟着新位置走：补间是按「播放进度」
                    // 重算的，句柄留在旧时间上会让两套时间轴立刻对不上。
                    item.lastAdvanceMs = -1;
                    for (var handleIndex = 0; handleIndex < item.tweenHandles.length; handleIndex++) {

                        if (handle.state !== "playing") {

                            : 0;

                        }

            }

            // 之后仍走 tween 插值。不重跑脚本就无法知道脚本建了哪些元素、
            // 建在哪个坐标上，这是元素已被释放后唯一正确的做法。
            function rebuildItemElementsForSeek(item, now) {
                var elapsed = now - item.startMs;
                if (elapsed < 0) {

                }

                var hasLiveElement = false;
                for (var index = 0; index < item.elements.length; index++) {

                    if (!element.expired && elapsed < element.lifeTimeMs) {

                        break;
                    }
                }

                if (hasLiveElement) {
                    return;
                }

                deactivateItem(item);
                activateItem(item, now);
            }

            // 再拖回来必须重建。判据与 resetItemsForSeek 一致。
            function isItemWindowReentered(item, now) {
                return isInWindow(item, now) && item.activated && !item.failed;
            }

            function clearAllItems() {
                for (var index = 0; index < items.length; index++) {
                    var item = items[index];
                    item.activated = false;
                    item.removed = true;
                    // 整批作废同样要清定时器与句柄：条目被丢弃后它们不能再跑。
                    clearItemTimers(item);
                    clearItemTriggers(item);
                    item.frameListeners = [];
                    for (var elementIndex = 0; elementIndex < item.elements.length; elementIndex++) {

                    }

                    item.elements = [];
                }

                items = [];
                // reset 时清空 $G：M8 的全局变量只在一次播放/一批脚本内共享。
                globalStore = {};
                // 遮罩元件随整批条目一起作废，遮罩本身也要摘掉，否则下一批
                // 弹幕会被上一批的遮罩裁掉。

                rootElement.childList = [];
                rootElement.composite = null;
                elements = [];
            }

                    return;
                }

                    }

                    }
                }

            // 其它元素取决于本地包围盒；再把本地包围盒的四个角按元素的变换
            // （缩放 → 旋转 → 平移，与 applyElementTransform 同序）投到页面坐标，
            // 取外接矩形。旋转时外接矩形会变大，宁可多擦一点也不能留残影。
            function computeElementCanvasRect(element) {

                }

                    if (!element.composite || !element.compositeBounds) {

                } else if (element.cacheBounds) {

                var scaleY = toFiniteNumber(props.scaleY, 1);

                var sin = Math.sin(rotation);

                    [bounds.x + bounds.width, bounds.y],
                    [bounds.x + bounds.width, bounds.y + bounds.height],
                    [bounds.x, bounds.y + bounds.height]

                var minY = Infinity;

                    var localY = corners[index][1] * scaleY;

                    height: Math.ceil((maxY - minY + DIRTY_RECT_PADDING * 2) * ratio)

            function flushEraseRects(rects) {

                        current.compositeDirty = true;
                        return;
                    }

                    current = current.treeParent;
                }
            }

            // 元素在主画布上的变换后位置变了（或它刚被隐藏），
            // 上一帧的像素就要在下一帧被擦掉。retireElementRect 会清掉
            // lastPaintedRect，所以同一帧内重复调用不会重复入队。
            function enqueueElementErase(element) {
                retireElementRect(element);
            }

            // 元素移动/缩放/旋转/隐藏/释放时调用：把上帧包围盒入队擦除，
            // 并让元素在下一帧重新合成（它自己或它所在的复合层）。
            function markElementMoved(element) {

                }

                if (element.painted || hadOwnRect) {

                }

                if (!hadOwnRect) {
                    // 自己在主画布上没有矩形（像素落在祖先的复合层里）：祖先重烘后
                    // 透明处盖不住旧像素，必须向上找最近一个画到主画布上的祖先擦掉。
                    retirePaintedAncestorRect(element);

                dirty = true;
                var parent = element.treeParent;
                if (parent && parent !== rootElement) {
                    // 子元素动了，父复合层要重烘；这里只标 compositeDirty，
                    // 不动 parent.needsCache（后者会连带重建父元件的叶子缓存）。
                    parent.compositeDirty = true;
                }
            }

            // ---- 舞台遮罩（M8 的 Player.setMask）----
            //
            // 语义：把整块脚本弹幕画布裁剪到 mask 元件的形状里（M8 里 setMask 设置的是

            //

            // 不受影响，所以遮罩不会让任何元素重建位图（缓存只在内容变化时失效）。
            // 擦除（flushEraseRects）与整屏清空（clearSurface）都**不带裁剪**：

            function setStageMask(element) {

                // 条目回收时也会被一起释放。
                if (next && next.treeParent) {
                    removeChildFromParent(next);
                }

                if (!context2d || !canvas) {
                    return;
                }

                // 可见区域变了，主画布上已有像素全部作废：整屏清掉，
                // 再把所有元素标脏重合成一次（内容缓存不动，只重合成）。
                pendingEraseRects = [];
                clearSurface();
                markAllComposited();
            }

            // 把已登记元素的「上一帧呈现记录」作废，强制重合成一次。
            // 只标脏、不清 needsCache：元素自身的位图没变，重建纯属浪费。
            function markAllComposited() {
                for (var index = 0; index < elements.length; index++) {
                    var element = elements[index];
                    element.propertyDirty["*"] = true;
                    element.lastPaintedRect = null;
                }

                dirty = true;
                if (visible) {
                    ensureRunning();
                }
            }

            // 按 mask 元件的形状给 target 加上裁剪区。返回 true 表示加过 save，
            // 调用方必须 restore。
            function applyStageMask(target) {
                if (!stageMaskElement
                    || stageMaskElement.expired
                    || stageMaskElement.props.visible === false) {
                    return false;
                }

                target.save();
                applyElementTransform(target, stageMaskElement);
                if (!traceElementClipPath(target, stageMaskElement)) {
                    target.restore();
                    return false;
                }

                target.clip();
                return true;
            }

            // 把元件的形状描进当前路径（只建路径，不填充不描边），供 clip() 使用。
            // 形状类元件按它自己的图元描；文本 / 图片 / 复合元件退化成它的外接矩形
            // （M8 里能用文本当遮罩，这里按矩形近似，见文档 §3 的说明）。
            //
            // map 是可选的「局部坐标 → 目标坐标」换算（缺省即恒等，表示当前
            // 上下文的变换已经就位）。元素级遮罩传 createMaskPointMapper 的结果：
            // 那条路径不能靠 canvas 的 save/restore 压变换（restore 会把裁剪一起
            // 撤掉），所以把变换烘进坐标里。
            function traceElementClipPath(target, element, map) {

                var items = element.kind === "shape" ? element.shapeItems : null;
                if (!items || items.length === 0) {

                    if (!bounds) {
                        return false;
                    }

                    target.beginPath();
                    tracePolygonPoints(target, [
                        mapper ? mapper(bounds.x, bounds.y) : { x: bounds.x, y: bounds.y },
                        mapper

                    function timer(closure, delay) {
                        return scheduleItemTimer(closure, delay, true, 1);
                    },
                    function interval(closure, delay, times) {
                        return scheduleItemTimer(closure, delay, false, times);
                    },
                    clearTimer,
                    trace,
                    tracex,
                    stopExecution,
                    foreach,
                    clone,
                    getTimer
                ];
            }

            // ---- 宿主命令对象（控件通过 ExecuteScriptAsync 逐字调用）----

            window.scriptDanmakuHost = {
                reset: function (positionSeconds, playing, rate, shouldShow) {
                    generation++;
                    clearAllItems();
                    state.positionMs = Math.max(0, Number(positionSeconds) || 0) * 1000;
                    state.playing = !!playing;
                    state.rate = Number(rate) > 0 ? Number(rate) : 1;
                    state.updatedAt = performance.now();
                    visible = shouldShow !== false;
                    pendingItemJson = "";
                    if (visible) {
                        ensureCanvas();
                        // 整批条目已作废：被丢弃的元素不会再进擦除队列，光靠
                        // 「脏元素重绘」会把上一批弹幕的像素永久留在画布上。
                        clearSurface();
                        dirty = false;
                    } else {
                        stopRunning();
                    }
                },
                append: function (list) {
                    appendItems(list);
                },
                beginItem: function () {
                    // 大 payload 分块：先清缓冲，后续 appendItemChunk 逐块追加。
                    pendingItemJson = "";
                },
                appendItemChunk: function (chunk) {
                    pendingItemJson += chunk === undefined || chunk === null ? "" : String(chunk);
                },
                endItem: function () {
                    var json = pendingItemJson;
                    pendingItemJson = "";
                    if (!json) {
                        return;
                    }

                    var model = null;
                    try {
                        model = JSON.parse(json);
                    } catch (error) {
                        reportCompileError(error, "");
                        return;
                    }

                    if (!model) {
                        return;
                    }

                    // 与 append 同一条路径，同样受 generation 保护。
                    addItem(model, generation);
                },
                setState: setState,
                seek: function (positionSeconds, playing, rate) {
                    seekTo(positionSeconds, playing, rate);
                },
                visible: function (shouldShow) {
                    visible = shouldShow !== false;
                    if (visible) {
                        dirty = true;
                        ensureRunning();
                    } else {
                        // 隐藏时立刻停帧并清空画布；合成步骤也会拦住脏元素。
                        stopRunning();
                    }
                },
                resize: function () {
                    ensureCanvas();
                    resizeCanvas();
                    dirty = true;
                    if (visible) {
                        ensureRunning();
                    }
                },
                // ---- 弹幕数据链 / 输入链（C# → 宿主）----
                // 弹幕快照分两段推：resetComments() 清空 + appendComments(list)
                // 按 24KB 一包追加以外的批量（与 append/beginItem 的分块风格一致）。
                resetComments: function () {
                    commentSnapshot = [];
                },
                appendComments: function (list) {
                    if (!Array.isArray(list)) {
                        return;
                    }

                    for (var index = 0; index < list.length; index++) {
                        commentSnapshot.push(normalizeComment(list[index]));
                    }
                },
                // 用户发送了一条弹幕：投递给在窗口内条目的 commentTrigger。
                // M8 的 CommentData.time 是秒，C# 侧传的就是播放位置（秒）。
                pushComment: function (comment) {
                    deliverCommentTrigger(normalizeComment(comment));
                },
                // 键盘事件：投递给在窗口内条目的 keyTrigger（up=true 的只收 keyUp）。
                pushKey: function (keyCode, up) {
                    deliverKeyTrigger(Math.trunc(toFiniteNumber(keyCode, -1)), !!up);
                }
            };

            window.addEventListener("resize", window.scriptDanmakuHost.resize);
            ensureCanvas();
            post("ready");
        })();
    </script>
</body>
</html>
